<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yerel Asistan</title>
<style>
  :root {
    --bg:#16181d; --panel:#1e2128; --line:#2c3039; --fg:#e6e8ec;
    --dim:#9aa1ad; --accent:#6aa6ff; --me:#243044; --code:#11131a;
  }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column;
         background:var(--bg); color:var(--fg);
         font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:12px; flex-wrap:wrap; }
  header b { font-weight:600; }
  header span { color:var(--dim); font-size:13px; }
  #temizle { margin-left:auto; background:none; border:1px solid var(--line);
             color:var(--dim); border-radius:6px; padding:4px 10px; cursor:pointer; font-size:13px; }
  #sifirla { background:none; border:1px solid var(--line); color:var(--dim);
            border-radius:6px; padding:5px 10px; cursor:pointer; font-size:13px; }
  #sifirla:hover, #temizle:hover { color:var(--fg); border-color:var(--dim); }
  main { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  .m { max-width:min(760px,92%); padding:10px 14px; border-radius:10px; white-space:pre-wrap;
       word-wrap:break-word; }
  .sen { align-self:flex-end; background:var(--me); }
  .ai  { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .ai code, .ai pre { background:var(--code); border-radius:5px; padding:1px 5px;
                      font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14px; }
  .bekle { color:var(--dim); font-style:italic; }
  .hata { color:#ff8f8f; }
  .uyari { display:block; margin-top:8px; padding:6px 9px; border-radius:6px;
           background:#3a2a12; border:1px solid #7a5a20; color:#ffcf7a; font-size:13px; }
  #ayar { border-top:1px solid var(--line); background:var(--panel); padding:10px 16px;
          display:flex; gap:20px; align-items:center; flex-wrap:wrap; font-size:13px; }
  #ayar label { display:flex; align-items:center; gap:8px; color:var(--dim); }
  #ayar input[type=range] { width:110px; accent-color:var(--accent); }
  #ayar output { color:var(--fg); min-width:34px; font-variant-numeric:tabular-nums; }
  #talimat { flex:1; min-width:240px; background:var(--code); color:var(--fg);
             border:1px solid var(--line); border-radius:6px; padding:6px 9px;
             font-family:inherit; font-size:13px; resize:vertical; min-height:34px; }
  footer { display:flex; gap:10px; padding:12px 16px; border-top:1px solid var(--line); }
  #soru { flex:1; background:var(--panel); color:var(--fg); border:1px solid var(--line);
          border-radius:8px; padding:10px 12px; font:inherit; resize:none; min-height:44px;
          max-height:180px; }
  #gonder { background:var(--accent); color:#0d1017; border:0; border-radius:8px;
            padding:0 20px; font-weight:600; cursor:pointer; }
  #gonder:disabled { opacity:.45; cursor:default; }
</style>
</head>
<body>
<header>
  <b>Yerel Asistan</b><span id="model">…</span>
  <button id="temizle" title="Sohbet geçmişini sil">temizle</button>
</header>

<main id="sohbet"></main>

<div id="ayar">
  <label>sıcaklık <input type="range" id="temp" min="0" max="1.2" step="0.1" value="0">
    <output id="tempV">0.0</output></label>
  <label>top_p <input type="range" id="topp" min="0.1" max="1" step="0.05" value="0.95">
    <output id="toppV">0.95</output></label>
  <label>uzunluk <input type="range" id="uzun" min="50" max="1000" step="50" value="400">
    <output id="uzunV">400</output></label>
  <textarea id="talimat" spellcheck="false"></textarea>
  <button id="sifirla" title="Sunucudaki varsayılan talimata dön">sıfırla</button>
</div>

<footer>
  <textarea id="soru" placeholder="Sorunu yaz…  (Enter gönderir, Shift+Enter alt satır)"></textarea>
  <button id="gonder">gönder</button>
</footer>

<script>
let varsayilan = "";   // sunucudan gelir

const $ = s => document.querySelector(s);
const sohbet = $("#sohbet");
let gecmis = [];          // sunucuya giden mesajlar


for (const [kaydirici, ciktı, bicim] of [["#temp","#tempV",v=>(+v).toFixed(1)],
                                         ["#topp","#toppV",v=>(+v).toFixed(2)],
                                         ["#uzun","#uzunV",v=>v]]) {
  const k = $(kaydirici), c = $(ciktı);
  const yaz = () => { c.textContent = bicim(k.value); localStorage.setItem(kaydirici, k.value); };
  const kayitli = localStorage.getItem(kaydirici);
  if (kayitli !== null) k.value = kayitli;
  k.addEventListener("input", yaz); yaz();
}
$("#talimat").addEventListener("input", e => localStorage.setItem("talimat", e.target.value));

function baloncuk(sinif, metin) {
  const d = document.createElement("div");
  d.className = "m " + sinif;
  d.textContent = metin;
  sohbet.appendChild(d);
  sohbet.scrollTop = sohbet.scrollHeight;
  return d;
}

async function gonder() {
  const soru = $("#soru").value.trim();
  if (!soru) return;
  $("#soru").value = "";
  $("#gonder").disabled = true;
  baloncuk("sen", soru);
  const bekleyen = baloncuk("ai bekle", "düşünüyor…");
  const basladi = Date.now();

  gecmis.push({role:"user", content:soru});
  // Son 6 mesajı gönderiyorum: NPU'nun istem sınırı dar, uzun geçmiş taşırıyor.
  const mesajlar = [{role:"system", content:$("#talimat").value}, ...gecmis.slice(-6)];

  try {
    const y = await fetch("/v1/chat/completions", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({messages:mesajlar, temperature:+$("#temp").value,
                            top_p:+$("#topp").value, max_tokens:+$("#uzun").value})
    });
    if (!y.ok) throw new Error("sunucu " + y.status);
    const gelen = await y.json();
    const cevap = gelen.choices[0].message.content;
    gecmis.push({role:"assistant", content:cevap});
    bekleyen.className = "m ai";
    bekleyen.textContent = cevap;
    if (gelen.risk) {
      const u = document.createElement("span");
      u.className = "uyari";
      u.textContent = "⚠ Bu cevap geri dönüşü olmayan bir komut içeriyor (silme, biçimlendirme, " +
                      "yeniden başlatma). Uygulamadan önce oku, emin değilsen uygulama.";
      bekleyen.appendChild(u);
    }
    const sn = ((Date.now()-basladi)/1000).toFixed(1);
    const not = document.createElement("span");
    not.style.cssText = "color:var(--dim);font-size:12px;display:block;margin-top:6px";
    not.textContent = sn + " sn";
    bekleyen.appendChild(not);
  } catch (e) {
    bekleyen.className = "m ai hata";
    bekleyen.textContent = "Hata: " + e.message +
      "\nSunucu kapalı olabilir:  systemctl --user status ai-npu";
    gecmis.pop();
  } finally {
    $("#gonder").disabled = false;
    $("#soru").focus();
  }
}

$("#gonder").addEventListener("click", gonder);
$("#soru").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); gonder(); }
});
$("#temizle").addEventListener("click", () => { gecmis = []; sohbet.innerHTML = ""; $("#soru").focus(); });

$("#sifirla").addEventListener("click", () => {
  $("#talimat").value = varsayilan;
  localStorage.setItem("talimat", varsayilan);
});

fetch("/v1/models").then(r => r.json())
  .then(d => {
    // owned_by = modelin gercekte calistigi cihaz; klasor adi yaniltici olabiliyor
    $("#model").textContent = d.data[0].id + " · " + d.data[0].owned_by + " üzerinde";
    varsayilan = d.system;
    $("#talimat").value = localStorage.getItem("talimat") || varsayilan;
  })
  .catch(() => $("#model").textContent = "sunucuya ulaşılamadı");
$("#soru").focus();
</script>
</body>
</html>
